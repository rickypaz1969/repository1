yaml
name: Validate CloudFormation Templates

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  validate:
    name: Validate Templates
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Validate CloudFormation Templates
      run: |
        echo "Searching for CloudFormation templates..."
        # If no cloudformation files exist yet, this prevents the script from failing early
        shopt -s globstar nullglob
        for file in **/*.yaml **/*.yml **/*.json; do
          if [[ "$file" != .github* ]] && grep -q "AWSTemplateFormatVersion" "$file"; then
            echo "Validating $file..."
            aws cloudformation validate-template --template-body "file://$file"
          fi
        done
        echo "Validation pass completed."
