yaml
name: Validate CloudFormation Templates

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # This enables the manual "Run workflow" button from your instructions

jobs:
  validate:
    name: Validate Templates
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    # This loops through all .yaml or .json files to validate your CloudFormation syntax
    - name: Validate CloudFormation Templates
      run: |
        echo "Searching for CloudFormation templates..."
        for file in $(find . -name "*.yaml" -o -name "*.yml" -o -name "*.json" | grep -v ".github"); do
          if grep -q "AWSTemplateFormatVersion" "$file"; then
            echo "Validating $file..."
            aws cloudformation validate-template --template-body "file://$file"
          fi
        done
